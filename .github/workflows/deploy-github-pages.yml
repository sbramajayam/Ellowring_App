name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          GITHUB_PAGES: "true"
          # Prefer repo Variable/Secret; fall back to tunnel for public Pages demo.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL != '' && vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL != '' && secrets.NEXT_PUBLIC_API_URL || 'https://wheels-fossil-surge-elimination.trycloudflare.com/api/v1' }}
          NEXT_PUBLIC_BASE_PATH: /Ellowring_App
          NEXT_PUBLIC_OLD_WEBSITE_URL: https://sbramajayam.github.io/E-website-app
        run: npm run build

      - name: Write runtime-config for Pages
        working-directory: frontend
        env:
          API_URL: ${{ vars.NEXT_PUBLIC_API_URL != '' && vars.NEXT_PUBLIC_API_URL || secrets.NEXT_PUBLIC_API_URL != '' && secrets.NEXT_PUBLIC_API_URL || 'https://wheels-fossil-surge-elimination.trycloudflare.com/api/v1' }}
        run: |
          cat > out/runtime-config.js << EOF
          window.__ELLOWRING_API_URL__ = "${API_URL}";
          EOF
          touch out/.nojekyll

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: frontend/out
          publish_branch: gh-pages
          force_orphan: true
          enable_jekyll: false
